# 参考文档：https://doc.qt.io/qt-6/windows-building.html
#
# dll 需要保持 ABI 兼容，以便直接替换。

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.10.2'

jobs:
  windows-mingw:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      # 安装 MinGW 13.1（win64_mingw）；不拉取预编译 Qt 库，由本仓库源码构建。
      - name: Install MinGW (Qt ${{ env.QT_VERSION }} win64_mingw)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          no-qt-binaries: true
          cache: true

      - name: Install Ninja
        run: choco install ninja -y
        shell: cmd

      # -no-prefix：产物直接落在 build/，无需 cmake --install，避免再生成一整棵 install/（doc、include、mkspecs、modules 等）。
      # -DQT_BUILD_TOOLS_BY_DEFAULT=OFF：默认不编 qmake、androiddeployqt 等独立工具（-nomake tools 尚未接入 CMake）。
      - name: Configure
        shell: cmd
        run: |
          mkdir build
          cd build
          call ..\configure.bat -no-prefix -release -nomake examples -nomake tests -no-gui -no-sbom -no-sql-psql -no-sql-odbc -no-sql-mysql -no-sql-oci -no-sql-db2 -no-sql-ibase -no-sql-mimer -- -DQT_BUILD_TESTS=OFF -DQT_BUILD_TOOLS_BY_DEFAULT=OFF

      - name: Build
        shell: cmd
        working-directory: build
        run: cmake --build . --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qtbase-windows
          path: |
            build/bin
          if-no-files-found: error
          retention-days: 14
